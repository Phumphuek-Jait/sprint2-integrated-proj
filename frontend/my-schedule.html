<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Schedule</title>
    <link rel="stylesheet" href="Create.css" />
  </head>

  <body>
    <main>
      <!-- User Information -->
      <section id="account-section" aria-live="polite">
        <div id="user-account" hidden>
          <span>
            Welcome,
            <span id="user-display-name" data-testid="user-name"> </span>
          </span>

          <button id="sign-out-button" type="button">Sign Out</button>
        </div>

        <!-- Student Profile -->
        <p id="student-profile" data-testid="student-profile" hidden></p>

        <!-- Not a BSc.IT Student -->
        <p id="not-student-message" data-testid="not-student" hidden>
          Your account is not a student of the BSc.IT program.
        </p>

        <!-- Lecturer -->
        <p id="lecturer-message" data-testid="lecturer-message" hidden>
          The lecturer view is coming soon
        </p>
      </section>

      <!-- Courses to Choose (Existing Section) -->
      <section id="course-options-section" hidden>
        <h2>Courses to Choose</h2>

        <table data-testid="course-options">
          <thead>
            <tr>
              <th>Code</th>
              <th>Title</th>
              <th>Type</th>
              <th>Section</th>
              <th>Group</th>
              <th>Day</th>
              <th>Time</th>
              <th>Weeks</th>
              <th>Room</th>
              <th>Remarks</th>
            </tr>
          </thead>

          <tbody id="course-options-body"></tbody>
        </table>
      </section>

      <!-- Error Dialog -->
      <dialog id="error-modal" class="error-modal-overlay" closedby="none">
        <div class="error-modal-content">
          <p>There is a problem. Please try again later.</p>
        </div>
      </dialog>
    </main>

    <script type="module" src="./script/my-schedule.js"></script>
  </body>
</html>
