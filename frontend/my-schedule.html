<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Schedule</title>
    <link rel="stylesheet" href="Create.css">
</head>
<body>
    <div data-testid="user-name">
        <span id="user-display-name"></span>
        <button id="sign-out-button">Sign Out</button>
    </div>

    <p id="not-student-message" data-testid="not-student" hidden>Your account is not a student of the BSc.IT program.</p>
    <p id="lecturer-message" data-testid="lecturer-message" hidden>The lecturer view is comming soon</p>

    <section id="my-schedule-section" hidden>
        <h2>My Schedule</h2>
        <p id="student-profile"></p>
        <table data-testid="my-schedule">
            <thead>
                <tr>
                    <th>Code</th>
                    <th>Title</th>
                    <th>Type</th>
                    <th>Section</th>
                    <th>Group</th>
                    <th>Day</th>
                    <th>Time</th>
                    <th>Weeks</th>
                    <th>Room</th>
                    <th>Remarks</th>
                </tr>
            </thead>
            <tbody id="my-schedule-body"></tbody>
        </table>
    </section>

    <section id="course-options-section" hidden>
        <h2>Courses to Choose</h2>
        <table data-testid="course-options">
            <thead>
                <tr>
                    <th>Code</th>
                    <th>Title</th>
                    <th>Type</th>
                    <th>Section</th>
                    <th>Group</th>
                    <th>Day</th>
                    <th>Time</th>
                    <th>Weeks</th>
                    <th>Room</th>
                    <th>Remarks</th>
                </tr>
            </thead>
            <tbody id="course-options-body"></tbody>
        </table>
    </section>

    <dialog id="error-modal" class="error-modal-overlay" closedby="none">
        <div class="error-modal-content">
            <p>There is a problem. Please try again later.</p>
        </div>
    </dialog>

    <script type="module" src="./script/my-schedule.js"></script>
</body>
</html>
