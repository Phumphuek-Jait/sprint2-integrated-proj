services:
  frontend:
    build: # an image you own: built from a directory
      context: ./frontend
      dockerfile: Dockerfile # only when it is not called Dockerfile
    restart: unless-stopped

  db:
    image: mysql:8.4
    volumes:
      - class_schdule-db-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 5s
      timeout: 3s
      retries: 12

  proxy:
    image: nginx:1.30-alpine
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
    volumes:
      - ./proxy:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
    expose:
      - '3000'
    volumes:
      - ./backend/src/configs:/app/src/configs:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  class_schdule-db-data:
    external: true
    name: class_schdule-db-data
